<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 48" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap');
      .cm-word-dark-crafted {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        fill: #09090B;
      }
      .cm-word-dark-minds {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.22em;
        fill: #52525B;
      }
    </style>
    <linearGradient id="h_dark_c" x1="5" y1="10" x2="30" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="h_dark_m" x1="18" y1="16" x2="40" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="60%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>
  </defs>

  <!-- CM Monogram Icon -->
  <g transform="translate(4, 0)">
    <path d="M 30 10 H 17 C 10.373 10 5 15.373 5 22 V 26 C 5 32.627 10.373 38 17 38 H 30" 
          stroke="url(#h_dark_c)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 18 34 V 16 L 29 27 L 40 16 V 34" 
          stroke="url(#h_dark_m)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: CRAFTED MINDS -->
  <text x="58" y="29.5" class="cm-word-dark-crafted">CRAFTED</text>
  <text x="172" y="29.5" class="cm-word-dark-minds">MINDS</text>
